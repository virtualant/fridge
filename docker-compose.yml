services:
  frizider:
    build: .
    container_name: frizider
    restart: unless-stopped
    ports:
      - "3001:3000"
    volumes:
      - ./data:/app/data
    environment:
      - NODE_ENV=production
      - DATA_DIR=/app/data
      - AUTH_USER=${AUTH_USER:-4nt}
      - AUTH_PASS=${AUTH_PASS:-Jure006jur123#}

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: frizider-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}
    depends_on:
      - frizider
